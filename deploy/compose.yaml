# docker compose -f deploy/compose.yaml up -d --build
#
# Run from the repository root; the build context is the package directory.
services:
  claude-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: claude-cli-runner:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Published to loopback only. A personal instance should be reached from
      # other machines over a private network (Tailscale, WireGuard) or a
      # reverse proxy that terminates TLS — not by publishing 0.0.0.0:8788 to
      # whatever network the host happens to sit on.
      - "127.0.0.1:8788:8788"
    volumes:
      - runner-state:/var/lib/claude-runner
    # The CLI spawns a child process per request and needs no privileges of its
    # own beyond that.
    security_opt:
      - no-new-privileges:true
    # The native binary is large and each request forks it; too low a limit
    # shows up as intermittent spawn failures under concurrency.
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  runner-state:
